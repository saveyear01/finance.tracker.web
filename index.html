    <!--
      Paint in the cached theme before any JavaScript bundle loads, so a dark
      user never sees a light flash. next-themes keeps the account's choice in
      localStorage under "theme" and takes over once React mounts.
    -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a100f')
        }
      } catch {}
    </script>
    <!--
      The launch screen (#boot, below). Frame 0 is exactly the still iOS
      launch image — the page background with the mark centred at 96px — then
      the mark tips into 3D and its cards spring out of the pocket, and it
      floats until React calls dismissBoot() (src/lib/boot.ts). It sits
      outside #root so React mounting doesn't cut it off. Plain CSS, no
      library: it must paint before any bundle loads.
    -->
    <style>
      html { background: #f5f5f2; }
      html.dark { background: #0a100f; }
      #boot {
        --u: 0.96px;
        --tile: #11302c; --tile-edge: #0a1f1c; --mint: #6ad6c9; --mint-edge: #3fb3a6;
        --aqua: #2bb3a5; --aqua-edge: #1a8a7f; --wallet: #ffffff; --wallet-edge: #cfdcd8;
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #f5f5f2;
      }
      html.dark #boot { background: #0a100f; }
      #boot.is-gone { opacity: 0; transition: opacity 0.25s ease 0.2s; pointer-events: none; }
      .boot-scene { width: calc(100 * var(--u)); height: calc(100 * var(--u)); perspective: 520px; }
      .boot-mark, .boot-float, .boot-part, .boot-slab { transform-style: preserve-3d; }
      .boot-mark { position: relative; width: 100%; height: 100%; }
      .boot-float { position: absolute; inset: 0; }
      .boot-part { position: absolute; }
      .boot-slab, .boot-slab i { position: absolute; inset: 0; border-radius: inherit; }
      .boot-slab i { display: block; transform: translateZ(calc(var(--depth) * (var(--k, 1) - 1))); }
      @property --depth { syntax: "<length>"; inherits: true; initial-value: 0px; }
      .boot-tile { inset: 0; border-radius: 22.5%; }
      .boot-tile i { background: var(--tile-edge); }
      .boot-tile i:nth-last-child(2) { background: #0d2723; }
      .boot-tile i:last-child { background: var(--tile); }
      .boot-c1, .boot-c2 { border-radius: calc(7 * var(--u)); }
      .boot-c1 { left: calc(26 * var(--u)); top: calc(16 * var(--u)); width: calc(48 * var(--u)); height: calc(34 * var(--u)); }
      .boot-c1 i { background: var(--mint-edge); } .boot-c1 i:last-child { background: var(--mint); }
      .boot-c2 { left: calc(20 * var(--u)); top: calc(26 * var(--u)); width: calc(60 * var(--u)); height: calc(34 * var(--u)); }
      .boot-c2 i { background: var(--aqua-edge); } .boot-c2 i:last-child { background: var(--aqua); }
      .boot-wallet { left: calc(14 * var(--u)); top: calc(40 * var(--u)); width: calc(72 * var(--u)); height: calc(44 * var(--u)); border-radius: calc(10 * var(--u)); }
      .boot-wallet i { background: var(--wallet-edge); }
      .boot-wallet i:last-child { background: var(--wallet); overflow: hidden; }
      .boot-wallet i:last-child::after {
        content: ""; position: absolute; inset: -20% auto -20% 0; width: 40%;
        background: linear-gradient(100deg, transparent, rgba(106, 214, 201, 0.45) 50%, transparent 80%);
        transform: translateX(-160%) skewX(-12deg);
      }
      .boot-clasp {
        position: absolute; left: calc(53 * var(--u)); top: calc(17 * var(--u));
        width: calc(10 * var(--u)); height: calc(10 * var(--u)); border-radius: 50%; background: var(--tile);
      }

      @media (prefers-reduced-motion: no-preference) {
        #boot.is-playing .boot-mark { animation: boot-tilt 760ms cubic-bezier(0.2, 0.75, 0.25, 1) 120ms both; }
        #boot.is-playing .boot-float { animation: boot-float 3.4s ease-in-out 1500ms infinite; }
        #boot.is-playing .boot-tile { animation: boot-sink 760ms cubic-bezier(0.2, 0.75, 0.25, 1) 120ms both; }
        #boot.is-playing .boot-wallet { animation: boot-lift 760ms cubic-bezier(0.2, 0.75, 0.25, 1) 120ms both; }
        #boot.is-playing .boot-c2 { animation: boot-rise-2 820ms cubic-bezier(0.34, 1.5, 0.5, 1) 420ms both, boot-bob-2 3.4s ease-in-out 1500ms infinite; }
        #boot.is-playing .boot-c1 { animation: boot-rise-1 820ms cubic-bezier(0.34, 1.5, 0.5, 1) 560ms both, boot-bob-1 3.4s ease-in-out 1650ms infinite; }
        #boot.is-playing .boot-wallet i:last-child::after { animation: boot-glint 900ms ease-out 1150ms both; }
        #boot.is-leaving .boot-mark { animation: boot-leave 420ms cubic-bezier(0.5, 0, 0.75, 0) both; }
        #boot.is-leaving .boot-c1, #boot.is-leaving .boot-c2 { animation: boot-tuck 300ms cubic-bezier(0.5, 0, 0.75, 0) both; }
        #boot.is-leaving .boot-tile, #boot.is-leaving .boot-wallet { --depth: 10px; }
      }
      @keyframes boot-tilt { from { transform: rotateX(0) rotateY(0) scale(1); } to { transform: rotateX(26deg) rotateY(-30deg) scale(1.35); } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0) rotateY(0); } 50% { transform: translateY(-5px) rotateY(16deg) rotateX(-4deg); } }
      @keyframes boot-sink { to { --depth: 14px; transform: translateZ(-10px); } }
      @keyframes boot-lift { to { --depth: 9px; transform: translateZ(16px); } }
      @keyframes boot-rise-2 {
        from { transform: translate3d(0, 0, 0) rotateZ(0); }
        to { --depth: 4px; transform: translate3d(calc(-4 * var(--u)), calc(-12 * var(--u)), 6px) rotateZ(-8deg) rotateX(-8deg); }
      }
      @keyframes boot-rise-1 {
        from { transform: translate3d(0, 0, 0) rotateZ(0); }
        to { --depth: 4px; transform: translate3d(calc(6 * var(--u)), calc(-22 * var(--u)), 2px) rotateZ(7deg) rotateX(-12deg); }
      }
      @keyframes boot-bob-2 {
        0%, 100% { transform: translate3d(calc(-4 * var(--u)), calc(-12 * var(--u)), 6px) rotateZ(-8deg) rotateX(-8deg); }
        50% { transform: translate3d(calc(-4 * var(--u)), calc(-15 * var(--u)), 6px) rotateZ(-10deg) rotateX(-8deg); }
      }
      @keyframes boot-bob-1 {
        0%, 100% { transform: translate3d(calc(6 * var(--u)), calc(-22 * var(--u)), 2px) rotateZ(7deg) rotateX(-12deg); }
        50% { transform: translate3d(calc(6 * var(--u)), calc(-26 * var(--u)), 2px) rotateZ(9deg) rotateX(-12deg); }
      }
      @keyframes boot-glint { to { transform: translateX(380%) skewX(-12deg); } }
      @keyframes boot-tuck { to { transform: translate3d(0, 0, 0) rotateZ(0); } }
      @keyframes boot-leave {
        from { transform: rotateX(26deg) rotateY(-30deg) scale(1.35); opacity: 1; }
        to { transform: rotateX(0) rotateY(0) scale(1.7); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Finance Tracker">
      <div class="boot-scene" aria-hidden="true">
        <div class="boot-mark">
          <div class="boot-float">
            <div class="boot-part boot-tile"><div class="boot-slab"></div></div>
            <div class="boot-part boot-c1"><div class="boot-slab"></div></div>
            <div class="boot-part boot-c2"><div class="boot-slab"></div></div>
            <div class="boot-part boot-wallet"><div class="boot-slab"></div></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Each slab is ten thin layers, the last its face, the rest its edge;
      // spread over --depth as the mark tilts, they read as a solid piece.
      ;(function () {
        var boot = document.getElementById('boot')
        var slabs = boot.querySelectorAll('.boot-slab')
        for (var s = 0; s < slabs.length; s++) {
          var html = ''
          for (var i = 0; i < 10; i++) html += '<i style="--k:' + i / 9 + '"></i>'
          slabs[s].innerHTML = html
        }
        boot.querySelector('.boot-wallet i:last-child').innerHTML = '<span class="boot-clasp"></span>'
        window.__bootStart = performance.now()
        boot.classList.add('is-playing')
        // Never trap anyone behind it: if the app hasn't dismissed it by now,
        // something is wrong, and the page under it says what.
        setTimeout(function () {
          if (window.__dismissBoot) window.__dismissBoot()
          else boot.remove()
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
