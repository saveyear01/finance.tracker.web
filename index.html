    <!--
      Paint in the cached theme before any JavaScript bundle loads, so a dark
      user never sees a light flash. next-themes keeps the account's choice in
      localStorage under "theme" and takes over once React mounts.
    -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a100f')
        }
      } catch {}
    </script>
    <!--
      The boot screen: the page background with the mark centred, exactly as
      the iOS launch image and the session check (`SplashScreen`) draw it, so
      launch reads as one screen. React replaces it on its first render.
    -->
    <style>
      html { background: #f5f5f2; }
      html.dark { background: #0a100f; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-mark { width: 96px; height: 96px; display: block; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Finance Tracker">
        <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="22.5" fill="#11302c" />
          <rect x="26" y="16" width="48" height="34" rx="7" fill="#6ad6c9" />
          <rect x="20" y="26" width="60" height="34" rx="7" fill="#2bb3a5" />
          <rect x="14" y="40" width="72" height="44" rx="10" fill="#ffffff" />
          <circle cx="72" cy="62" r="5" fill="#11302c" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
