<!-- Full bleed, artwork kept inside the central 80% safe zone so Android's
     mask (circle, squircle, teardrop…) never clips the icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#11302c"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
  <rect x="26" y="16" width="48" height="34" rx="7" fill="#6ad6c9"/>
  <rect x="20" y="26" width="60" height="34" rx="7" fill="#2bb3a5"/>
  <rect x="14" y="40" width="72" height="44" rx="10" fill="#ffffff"/>
  <circle cx="72" cy="62" r="5" fill="#11302c"/>
  </g>
</svg>
